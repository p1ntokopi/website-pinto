<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background:#F7F5F0; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#171513" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5E3C" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="70" fill="#171513" />
  <text x="40" y="42" fill="#F7F5F0" font-size="20" font-weight="700" letter-spacing="0.5">P1NTO KOPI — ALUR UTAMA TRANSAKSI (CASHIER-FIRST MODEL)</text>

  <!-- Step 1: Customer Arrival -->
  <g transform="translate(60, 100)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 01</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Pelanggan Tiba</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Menuju meja kasir di counter</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 145 L 340 145" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Input Pesanan Kasir -->
  <g transform="translate(340, 100)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 02</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Kasir Input Menu</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Menu, opsi, jumlah &amp; catatan</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 560 145 L 620 145" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Pilih Meja & Buka Sesi -->
  <g transform="translate(620, 100)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 03</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Pilih Meja Tersedia</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Buka sesi meja (dining session)</text>
  </g>

  <!-- Arrow 3 -> 4 (Down & Left) -->
  <path d="M 730 190 L 730 240 L 730 250" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Konfirmasi Pelanggan -->
  <g transform="translate(620, 250)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 04</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Review &amp; Konfirmasi</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Pelanggan setujui ringkasan</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 620 295 L 560 295" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Duduk & Bawa Stand Meja -->
  <g transform="translate(340, 250)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 05</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Duduk di Meja</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Bawa nomor stand meja</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 340 295 L 280 295" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Tambah Pesanan via QR (Opsional) -->
  <g transform="translate(60, 240)">
    <rect width="220" height="110" rx="8" fill="#EAD9C5" stroke="#8B5E3C" stroke-width="2" stroke-dasharray="4" filter="url(#shadow)"/>
    <text x="16" y="28" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">OPSIONAL / SEKUNDER</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#171513">Tambah Pesanan (QR)</text>
    <text x="16" y="66" font-size="12" fill="#171513">Scan QR meja aktif</text>
    <text x="16" y="84" font-size="11" fill="#6E6A63">Masuk ke tagihan sesi yang sama</text>
  </g>

  <!-- Arrow 6 -> 7 (Down) -->
  <path d="M 170 350 L 170 410" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Pesanan Disajikan & Selesai Makan -->
  <g transform="translate(60, 410)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 06</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Selesai Menikmati</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Status pesanan menjadi SERVED</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 280 455 L 340 455" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8: Pembayaran di Kasir (Cash / QRIS) -->
  <g transform="translate(340, 410)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#8B5E3C"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#8B5E3C" letter-spacing="1">TAHAP 07</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Bayar di Kasir</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Tunai (Cash) atau QRIS Manual</text>
  </g>

  <!-- Arrow 8 -> 9 -->
  <path d="M 560 455 L 620 455" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 9: Cetak Struk & Tutup Sesi -->
  <g transform="translate(620, 410)">
    <rect width="220" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#2E7D32"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#2E7D32" letter-spacing="1">TAHAP 08 (SELESAI)</text>
    <text x="16" y="52" font-size="15" font-weight="700" fill="#171513">Cetak Struk &amp; Tutup</text>
    <text x="16" y="70" font-size="12" fill="#6E6A63">Struk keluar, meja kembali bebas</text>
  </g>

  <!-- Note box at bottom -->
  <rect x="60" y="550" width="780" height="80" rx="6" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="80" y="578" font-size="13" font-weight="700" fill="#8B5E3C">ATURAN PENTING OPERASIONAL:</text>
  <text x="80" y="600" font-size="12" fill="#171513">1. Sesi meja HANYA dibuka oleh kasir di awal. QR meja hanya berfungsi sebagai kanal TAMBAH PESANAN.</text>
  <text x="80" y="618" font-size="12" fill="#171513">2. Seluruh pesanan dalam satu sesi meja digabung ke dalam SATU TAGIHAN (One Bill). Split bill tidak didukung.</text>
</svg>
