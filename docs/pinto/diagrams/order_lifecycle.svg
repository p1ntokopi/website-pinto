<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%" style="background:#F7F5F0; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#171513" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5E3C" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C94C4C" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="840" height="60" fill="#171513" />
  <text x="30" y="38" fill="#F7F5F0" font-size="18" font-weight="700" letter-spacing="0.5">SIKLUS HIDUP &amp; TRANSISI STATUS PESANAN (ORDER STATUS MACHINE)</text>

  <!-- State: NEW -->
  <g transform="translate(50, 110)">
    <rect width="140" height="80" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="70" y="36" font-size="16" font-weight="800" fill="#1D4ED8" text-anchor="middle">NEW</text>
    <text x="70" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Pesanan Baru</text>
  </g>

  <!-- Arrow NEW -> PREPARING -->
  <path d="M 190 150 L 250 150" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="220" y="140" font-size="10" font-weight="600" fill="#8B5E3C" text-anchor="middle">Kitchen/Staff</text>

  <!-- State: PREPARING -->
  <g transform="translate(250, 110)">
    <rect width="140" height="80" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="70" y="36" font-size="16" font-weight="800" fill="#D97706" text-anchor="middle">PREPARING</text>
    <text x="70" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Sedang Dibuat</text>
  </g>

  <!-- Arrow PREPARING -> READY -->
  <path d="M 390 150 L 450 150" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="420" y="140" font-size="10" font-weight="600" fill="#8B5E3C" text-anchor="middle">Kitchen</text>

  <!-- State: READY -->
  <g transform="translate(450, 110)">
    <rect width="140" height="80" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="70" y="36" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">READY</text>
    <text x="70" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Siap Disajikan</text>
  </g>

  <!-- Arrow READY -> SERVED -->
  <path d="M 590 150 L 650 150" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="620" y="140" font-size="10" font-weight="600" fill="#8B5E3C" text-anchor="middle">Staff/Server</text>

  <!-- State: SERVED (Terminal) -->
  <g transform="translate(650, 110)">
    <rect width="140" height="80" rx="8" fill="#171513" stroke="#171513" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="70" y="36" font-size="16" font-weight="800" fill="#F7F5F0" text-anchor="middle">SERVED</text>
    <text x="70" y="58" font-size="11" fill="#EAD9C5" text-anchor="middle">Sudah Diantar</text>
  </g>

  <!-- Cancellation Paths to CANCELLED -->
  <!-- State: CANCELLED (Terminal) -->
  <g transform="translate(350, 270)">
    <rect width="140" height="75" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="70" y="34" font-size="15" font-weight="800" fill="#DC2626" text-anchor="middle">CANCELLED</text>
    <text x="70" y="54" font-size="11" fill="#991B1B" text-anchor="middle">Dibatalkan (Wajib Alasan)</text>
  </g>

  <!-- From NEW to CANCELLED -->
  <path d="M 120 190 L 120 310 L 350 310" fill="none" stroke="#C94C4C" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowRed)"/>

  <!-- From PREPARING to CANCELLED -->
  <path d="M 320 190 L 320 270" fill="none" stroke="#C94C4C" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowRed)"/>

  <!-- From READY to CANCELLED -->
  <path d="M 520 190 L 520 310 L 490 310" fill="none" stroke="#C94C4C" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowRed)"/>

  <!-- Legend & Notes -->
  <rect x="50" y="375" width="740" height="65" rx="6" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1"/>
  <text x="70" y="398" font-size="12" font-weight="700" fill="#171513">Hak Transisi Berdasarkan Peran:</text>
  <text x="70" y="418" font-size="11" fill="#6E6A63">• Kitchen: NEW → PREPARING, PREPARING → READY</text>
  <text x="420" y="418" font-size="11" fill="#6E6A63">• Staff: PREPARING → SERVED, Pembatalan (CANCELLED)</text>
  <text x="70" y="433" font-size="11" fill="#6E6A63">• Admin &amp; Owner: Memiliki wewenang penuh atas seluruh transisi dan koreksi status</text>
</svg>
