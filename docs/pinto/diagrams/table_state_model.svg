<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%" style="background:#F7F5F0; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#171513" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5E3C" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="840" height="60" fill="#171513" />
  <text x="30" y="38" fill="#F7F5F0" font-size="18" font-weight="700" letter-spacing="0.5">MODEL STATUS MEJA &amp; SIKLUS SESI (TABLE STATE LIFECYCLE)</text>

  <!-- State 1: TERSEDIA (Available) -->
  <g transform="translate(60, 110)">
    <rect width="180" height="90" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" filter="url(#shadow4)"/>
    <rect x="0" y="0" width="180" height="8" rx="4" fill="#10B981"/>
    <text x="90" y="38" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">TERSEDIA</text>
    <text x="90" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Belum ada sesi aktif</text>
    <text x="90" y="74" font-size="11" fill="#6E6A63" text-anchor="middle">QR scan: Menolak order</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 155 L 330 155" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="285" y="142" font-size="10" font-weight="700" fill="#8B5E3C" text-anchor="middle">Kasir Buka</text>
  <text x="285" y="175" font-size="9" fill="#6E6A63" text-anchor="middle">Pesanan Baru</text>

  <!-- State 2: TERISI / AKTIF (Occupied) -->
  <g transform="translate(330, 110)">
    <rect width="180" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow4)"/>
    <rect x="0" y="0" width="180" height="8" rx="4" fill="#F59E0B"/>
    <text x="90" y="38" font-size="16" font-weight="800" fill="#D97706" text-anchor="middle">TERISI / AKTIF</text>
    <text x="90" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Sesi meja open</text>
    <text x="90" y="74" font-size="11" fill="#6E6A63" text-anchor="middle">QR scan: Tambah Pesanan</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 510 155 L 600 155" fill="none" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="555" y="142" font-size="10" font-weight="700" fill="#8B5E3C" text-anchor="middle">Kasir Settle</text>
  <text x="555" y="175" font-size="9" fill="#6E6A63" text-anchor="middle">CASH / QRIS</text>

  <!-- State 3: DIBAYAR (Paid, Session Still Open) -->
  <g transform="translate(600, 110)">
    <rect width="180" height="90" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow4)"/>
    <rect x="0" y="0" width="180" height="8" rx="4" fill="#3B82F6"/>
    <text x="90" y="38" font-size="16" font-weight="800" fill="#1D4ED8" text-anchor="middle">DIBAYAR (PAID)</text>
    <text x="90" y="58" font-size="11" fill="#6E6A63" text-anchor="middle">Struk resmi terbit</text>
    <text x="90" y="74" font-size="11" fill="#6E6A63" text-anchor="middle">Meja belum bebas</text>
  </g>

  <!-- Loop back from State 3 to State 1 -->
  <path d="M 690 200 L 690 280 L 150 280 L 150 200" fill="none" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <text x="420" y="270" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle">Kasir Selesaikan Sesi (complete_dining_session) → Meja Bebas</text>

  <!-- Important Callout -->
  <rect x="60" y="330" width="720" height="75" rx="6" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="80" y="356" font-size="12" font-weight="700" fill="#8B5E3C">CATATAN PENTING:</text>
  <text x="80" y="376" font-size="11" fill="#171513">Pembayaran lunas (PAID) saja TIDAK otomatis mengosongkan meja di sistem.</text>
  <text x="80" y="392" font-size="11" fill="#171513">Kasir harus menyelesaikan sesi secara eksplisit agar meja kembali berstatus TERSEDIA untuk tamu baru.</text>
</svg>
